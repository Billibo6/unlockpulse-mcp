name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"   # daily: also checks that the live data file is reachable and well-formed
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.mjs
